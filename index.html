<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#EFF6FF">
  <title>数学世界 - 儿童数学闯关游戏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="app">

    <!-- ========== 首页 ========== -->
    <section id="page-home" class="page active">
      <div class="home-header">
        <button class="sound-toggle" id="sound-toggle" title="音效开关">
          <span id="sound-icon">🔊</span>
        </button>
        <div class="mascot animate-float" id="home-mascot">🦊</div>
        <h1 class="home-title">数学世界</h1>
        <p class="home-subtitle">快来一起闯关吧！</p>
        <div class="home-stats-bar">
          <div class="stat-pill">
            <span class="stat-icon">⭐</span>
            <span class="stat-value" id="home-points">0</span>
            <span class="stat-label">积分</span>
          </div>
          <div class="stat-pill">
            <span class="stat-icon">🏆</span>
            <span class="stat-value" id="home-badge-count">0</span>
            <span class="stat-label">徽章</span>
          </div>
          <div class="stat-pill">
            <span class="stat-icon">📝</span>
            <span class="stat-value" id="home-total-questions">0</span>
            <span class="stat-label">做题</span>
          </div>
        </div>
      </div>

      <div class="today-progress-card" id="today-progress-card">
        <!-- 今日学习进度 JS动态生成 -->
      </div>

      <div class="difficulty-cards" id="difficulty-cards">
        <!-- JS动态生成 -->
      </div>

      <div class="home-nav-bar">
        <button class="nav-btn" data-page="badges">
          <span class="nav-icon">🏅</span>
          <span class="nav-text">徽章</span>
        </button>
        <button class="nav-btn" data-page="themes">
          <span class="nav-icon">🎨</span>
          <span class="nav-text">主题</span>
        </button>
        <button class="nav-btn" data-page="error-book">
          <span class="nav-icon">📕</span>
          <span class="nav-text">错题本</span>
        </button>
        <button class="nav-btn" data-page="stats">
          <span class="nav-icon">📊</span>
          <span class="nav-text">档案</span>
        </button>
      </div>
    </section>

    <!-- ========== 答题页 ========== -->
    <section id="page-quiz" class="page">
      <div class="quiz-top-bar">
        <button class="icon-btn" id="quiz-back-btn">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="quiz-progress">
          <span class="quiz-progress-current" id="quiz-current">1</span>
          <span class="quiz-progress-sep">/</span>
          <span class="quiz-progress-total">10</span>
        </div>
        <div class="quiz-streak" id="quiz-streak-display" style="visibility:hidden">
          <span class="streak-fire">🔥</span>
          <span id="quiz-streak-count">0</span>
        </div>
      </div>

      <div class="quiz-progress-bar">
        <div class="quiz-progress-fill" id="quiz-progress-fill"></div>
      </div>

      <div class="quiz-dots" id="quiz-dots">
        <!-- 10个进度小圆点 JS动态生成 -->
      </div>

      <div class="quiz-type-tag" id="quiz-type-tag"></div>

      <div class="quiz-question-area" id="quiz-question-area">
        <!-- JS动态生成题目 -->
      </div>

      <div class="quiz-feedback" id="quiz-feedback"></div>

      <div class="keyboard-area" id="keyboard-area">
        <!-- 九宫格键盘 -->
      </div>
    </section>

    <!-- 连击里程碑特效层 -->
    <div class="streak-milestone" id="streak-milestone"></div>

    <!-- ========== 结算页 ========== -->
    <section id="page-settlement" class="page">
      <div class="settlement-container" id="settlement-container">
        <!-- JS动态生成 -->
      </div>
    </section>

    <!-- ========== 徽章页 ========== -->
    <section id="page-badges" class="page">
      <div class="sub-page-header">
        <button class="icon-btn back-btn" data-back="home">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h2 class="sub-page-title">🏅 我的徽章</h2>
        <div style="width:48px"></div>
      </div>
      <div class="badges-grid" id="badges-grid">
        <!-- JS动态生成 -->
      </div>
    </section>

    <!-- ========== 主题页 ========== -->
    <section id="page-themes" class="page">
      <div class="sub-page-header">
        <button class="icon-btn back-btn" data-back="home">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h2 class="sub-page-title">🎨 主题商店</h2>
        <div style="width:48px"></div>
      </div>
      <div class="themes-grid" id="themes-grid">
        <!-- JS动态生成 -->
      </div>
    </section>

    <!-- ========== 错题本页 ========== -->
    <section id="page-error-book" class="page">
      <div class="sub-page-header">
        <button class="icon-btn back-btn" data-back="home">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h2 class="sub-page-title">📕 错题本</h2>
        <div style="width:48px"></div>
      </div>
      <div class="error-book-tabs" id="error-book-tabs">
        <button class="tab-btn active" data-level="20">20以内</button>
        <button class="tab-btn" data-level="50">50以内</button>
        <button class="tab-btn" data-level="100">100以内</button>
      </div>
      <div class="error-book-list" id="error-book-list">
        <!-- JS动态生成 -->
      </div>
    </section>

    <!-- ========== 数据档案页 ========== -->
    <section id="page-stats" class="page">
      <div class="sub-page-header">
        <button class="icon-btn back-btn" data-back="home">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h2 class="sub-page-title">📊 成长档案</h2>
        <div style="width:48px"></div>
      </div>
      <div class="stats-container" id="stats-container">
        <!-- JS动态生成 -->
      </div>
    </section>

    <!-- ========== 通用弹窗 ========== -->
    <div class="overlay" id="overlay">
      <div class="modal" id="modal">
        <div class="modal-content" id="modal-content"></div>
      </div>
    </div>

    <!-- ========== 庆祝动画层 ========== -->
    <div class="celebration-layer" id="celebration-layer"></div>

  </div>

  <script src="js/storage.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/question-generator.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/difficulty.js"></script>
  <script src="js/badges.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/error-book.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/settlement.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/home.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
